scalar DateTime

type Report {
  id: ID!
  timestamp: DateTime!
  clientIp: String!
  resolved: Boolean!
  resolutionNote: String
}

type Query {
  ad: AdQuery!
}

type AdQuery {
  unresolved(since: DateTime): [Report!]!
}

type Mutation {
  ad: AdMutation!
}

type AdMutation {
  reportAd: Report!
  resolve(id: ID!, resolutionNote: String): Report!
  recordCandidateDomains(id: ID!, domains: [String!]!): Report!
}
